name: Build, Test and APK Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Validate and install release signing key for debug APK
      shell: bash
      env:
        KEYSTORE_B64: ${{ secrets.SIGNING_KEY_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        missing=0
        for var in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [[ -z "${!var:-}" ]]; then
            echo "::error title=Missing secret::${var} is not set. Check the four SIGNING_* repository secrets."
            missing=1
          fi
        done
        if [[ "$missing" -ne 0 ]]; then
          exit 1
        fi

        mkdir -p presentation
        printf '%s' "$KEYSTORE_B64" | base64 --decode > presentation/my-release-key.keystore
        test -s presentation/my-release-key.keystore
        chmod 600 presentation/my-release-key.keystore
        keytool -list -keystore presentation/my-release-key.keystore \
          -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

        {
          echo "keystore_password=$KEYSTORE_PASSWORD"
          echo "key_alias=$KEY_ALIAS"
          echo "key_password=$KEY_PASSWORD"
          echo "CI=true"
        } >> "$GITHUB_ENV"

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: List APK Output Directory
      run: ls -R presentation/build/outputs/apk/debug

    - name: Rename APK
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apk_files=(presentation/build/outputs/apk/debug/FoxholeMessages-v*-debug.apk)
        if [[ "${#apk_files[@]}" -eq 0 ]]; then
          echo "No APK found matching FoxholeMessages-v*-debug.apk" >&2
          exit 1
        fi
        if [[ "${#apk_files[@]}" -gt 1 ]]; then
          echo "Multiple APKs found: ${apk_files[*]}" >&2
          exit 1
        fi
        mv "${apk_files[0]}" presentation/build/outputs/apk/debug/FoxholeMessages-debug.apk

    # Upload before lint/tests so a test failure does not hide a buildable APK.
    - name: Upload App
      uses: actions/upload-artifact@v7
      with:
        name: apk-debug
        path: presentation/build/outputs/apk/debug/FoxholeMessages-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: Run Android Lint
      run: ./gradlew lint

    - name: Run Tests
      run: ./gradlew test

    - name: Compile Android instrumentation tests
      run: ./gradlew :data:assembleDebugAndroidTest

    - name: Cleanup signing key
      if: always()
      run: rm -f presentation/my-release-key.keystore
